version: '3.9'

services:
  db:
    container_name: db
    image: mongo
    volumes:
      - ${WEBAPP_STORAGE_HOME}/data:/data/db
    ports:
      - "27018:27017"

  produits:
    image: arteinsana/devops-app:produits.v1
    build: ${WEBAPP_STORAGE_HOME}/produit-service
    container_name: produit-service
    ports:
      - "5003:4000"
    volumes:
      - /app/node_modules
    depends_on:
      - db

  authentification:
    image: arteinsana/devops-app:auth.v1
    build: ${WEBAPP_STORAGE_HOME}/auth-service
    container_name: auth-service
    ports:
      - "5002:4002"
    volumes:
      - /app/node_modules
    depends_on:
      - db

  commande:
    image: arteinsana/devops-app:commande.v1
    build: ${WEBAPP_STORAGE_HOME}/commande-service
    container_name: commande-service
    ports:
      - "5001:4001"
    volumes:
      - /app/node_modules
    depends_on:
      - authentification
      - produits
      - db

  frontend:
    image: arteinsana/devops-app:frontend.v1
    build: ${WEBAPP_STORAGE_HOME}/frontend-service
    container_name: frontend-service
    ports:
      - "8080:8080"
    volumes:
      - /app/node_modules